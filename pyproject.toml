[project]
name = "syndicus-contracts"
# MAJOR == CONTRACT_VERSION (src/syndicus_contracts/__init__.py). Die Kopplung
# ist Absicht: am Pin des Clients (tag contracts-v1.x.y) liest man sofort ab,
# welche Draht-Version diese Box spricht, ohne den Code zu öffnen.
#   MAJOR  bump nur mit CONTRACT_VERSION — brechende Naht (Core akzeptiert N-1)
#   MINOR  additiv (neues optionales Feld/Modell) — alte Boxen laufen weiter
#   PATCH  Verhalten/Doku ohne Formänderung (z. B. Backoff-Kurve, Fehlermapping)
version = "1.9.0"
description = "Syndicus HTTP-Contract — Boundary-Typen zwischen syndicus_client (Kanzlei-Box) und syndicus_agents (Core-API). Der Server besitzt den Contract; versioniert über contract_version."
requires-python = ">=3.12"
dependencies = [
    "pydantic[email]>=2.0",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syndicus_contracts"]
